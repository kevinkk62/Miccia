<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#25322e" />
  <title>Samsung Interactive Display - Note</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #25322e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Sfondo lavagna ardesia verde scuro opaco */
    .board {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(255, 255, 255, 0.035) 0%, rgba(0, 0, 0, 0.16) 100%),
        #25322e;
      overflow: hidden;
      touch-action: none;
    }

    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
      cursor: crosshair;
    }

    /* Contenitore delle tre barre flottanti inferiori */
    .dock-container {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(18px, env(safe-area-inset-bottom, 18px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      gap: 14px;
      z-index: 10;
      pointer-events: none;
    }

    .toolbar {
      display: flex;
      align-items: stretch;
      height: 68px;
      background: rgba(250, 251, 252, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 3px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.34), 0 1px 3px rgba(0, 0, 0, 0.22);
      overflow: hidden;
      pointer-events: auto;
    }

    .tool-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 66px;
      height: 100%;
      border: none;
      background: transparent;
      color: #555e68;
      cursor: pointer;
      gap: 4px;
      padding: 6px 2px 5px;
      transition: background-color 0.08s ease, transform 0.06s ease;
    }

    .tool-btn:active,
    .tool-btn.pressed {
      background-color: rgba(35, 132, 216, 0.14);
      transform: scale(0.96);
    }

    /* Tasto attivo (Scrivi) */
    .tool-btn.active {
      background-color: #2384d8;
      color: #ffffff;
    }

    .tool-btn.active:active,
    .tool-btn.active.pressed {
      background-color: #1c73bf;
    }

    .tool-btn.has-sub::after {
      content: "";
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 6px 6px;
      border-color: transparent transparent #8a94a0 transparent;
    }

    .tool-btn.active.has-sub::after {
      border-color: transparent transparent #ffffff transparent;
    }

    .tool-btn svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .tool-label {
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.01em;
      white-space: nowrap;
      color: inherit;
    }

    .page-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 100%;
      gap: 4px;
      padding: 6px 4px 5px;
      color: #555e68;
    }

    .page-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 24px;
      padding: 0 8px;
      border-radius: 4px;
      background-color: #e8ecf1;
      border: 1px solid #d5dce4;
      color: #49525c;
      font-size: 11px;
      font-weight: 600;
    }

    @media (max-width: 1280px) {
      .dock-container {
        padding: 0 10px;
        gap: 8px;
      }
      .toolbar {
        height: 60px;
      }
      .tool-btn {
        width: clamp(38px, 4.7vw, 62px);
      }
      .page-indicator {
        width: clamp(42px, 5vw, 64px);
      }
      .tool-btn svg {
        width: 20px;
        height: 20px;
      }
      .tool-label {
        font-size: 9.5px;
      }
    }

    @media (max-width: 860px) {
      .dock-container {
        overflow-x: auto;
        justify-content: flex-start;
        padding: 0 8px;
      }
      .toolbar {
        flex-shrink: 0;
      }
      .tool-btn {
        width: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="board" id="board">
    <canvas id="draw-canvas"></canvas>
    <div class="dock-container">

      <!-- BARRA SINISTRA -->
      <div class="toolbar">
        <button class="tool-btn" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" stroke="#626b75" />
            <line x1="8" y1="9" x2="16" y2="9" stroke="#3b82d6" />
            <line x1="8" y1="12" x2="16" y2="12" stroke="#3b82d6" />
            <line x1="8" y1="15" x2="16" y2="15" stroke="#3b82d6" />
          </svg>
          <span class="tool-label">Menu</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Uscita">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h8" stroke="#626b75" />
            <path d="M11 12h9m0 0-3-3m3 3-3 3" stroke="#e05a47" />
          </svg>
          <span class="tool-label">Uscita</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Condividi">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="6" height="6" rx="1" stroke="#3b82d6" />
            <rect x="14" y="4" width="6" height="6" rx="1" stroke="#626b75" />
            <rect x="4" y="14" width="6" height="6" rx="1" stroke="#626b75" />
            <path d="M14 14h2v2h-2zm4 0h2v2h-2zm-4 4h2v2h-2zm4 2h2" stroke="#3b82d6" />
          </svg>
          <span class="tool-label">Condividi</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Elenco">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="4" height="4" rx="0.8" stroke="#e59a38" />
            <rect x="4" y="10.5" width="4" height="4" rx="0.8" stroke="#e59a38" />
            <rect x="4" y="16" width="4" height="4" rx="0.8" stroke="#e59a38" />
            <line x1="11" y1="7" x2="20" y2="7" stroke="#626b75" />
            <line x1="11" y1="12.5" x2="20" y2="12.5" stroke="#626b75" />
            <line x1="11" y1="18" x2="20" y2="18" stroke="#626b75" />
          </svg>
          <span class="tool-label">Elenco</span>
        </button>
      </div>

      <!-- BARRA CENTRALE -->
      <div class="toolbar">
        <button class="tool-btn" type="button" aria-label="Selezione">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 4l12 6.5-5.2 1.8L11 17.5 6 4z" stroke="#3b82d6" />
            <path d="M13 13l4.5 4.5" stroke="#626b75" />
          </svg>
          <span class="tool-label">Selezione</span>
        </button>

        <button class="tool-btn active has-sub" type="button" aria-label="Scrivi">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.5 4.5l4 4L8.5 19.5H4.5v-4L15.5 4.5z" />
            <path d="M13 7l4 4" />
          </svg>
          <span class="tool-label">Scrivi</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Gomma">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 5.5l4 4-7.5 7.5H6.5l-2-2 10-9.5z" stroke="#626b75" />
            <path d="M9.5 10.5l4 4" stroke="#e05a47" />
            <line x1="11" y1="17" x2="19.5" y2="17" stroke="#e05a47" />
          </svg>
          <span class="tool-label">Gomma</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Pulisci">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h13" stroke="#626b75" />
            <path d="M12.5 9.5l5 5m0-5l-5 5" stroke="#e05a47" />
          </svg>
          <span class="tool-label">Pulisci</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Righello">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16.5 3.5l4 4-13 13-4-4 13-13z" stroke="#3b82d6" />
            <line x1="13.5" y1="6.5" x2="15.5" y2="8.5" stroke="#626b75" />
            <line x1="10.5" y1="9.5" x2="12.5" y2="11.5" stroke="#626b75" />
            <line x1="7.5" y1="12.5" x2="9.5" y2="14.5" stroke="#626b75" />
          </svg>
          <span class="tool-label">Righello</span>
        </button>

        <button class="tool-btn has-sub" type="button" aria-label="Forma">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9.5" cy="9.5" r="4.5" stroke="#3b82d6" />
            <rect x="11" y="11" width="8" height="8" rx="1" stroke="#626b75" fill="rgba(250,251,252,0.85)" />
          </svg>
          <span class="tool-label">Forma</span>
        </button>

        <button class="tool-btn has-sub" type="button" aria-label="Tabella">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="16" height="14" rx="1.5" stroke="#626b75" />
            <line x1="4" y1="9.5" x2="20" y2="9.5" stroke="#3b82d6" />
            <line x1="4" y1="14.2" x2="20" y2="14.2" stroke="#626b75" />
            <line x1="9.5" y1="5" x2="9.5" y2="19" stroke="#3b82d6" />
            <line x1="14.5" y1="5" x2="14.5" y2="19" stroke="#626b75" />
          </svg>
          <span class="tool-label">Tabella</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Nota">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 4h14v11l-4 5H5V4z" stroke="#e59a38" />
            <path d="M15 15v5l4-5h-4z" stroke="#e59a38" />
            <line x1="8" y1="8.5" x2="15" y2="8.5" stroke="#626b75" />
            <line x1="8" y1="12" x2="13" y2="12" stroke="#626b75" />
          </svg>
          <span class="tool-label">Nota</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Muovi">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v5m0-5l-2 2m2-2l2 2" stroke="#3b82d6" />
            <path d="M9 12.5V8.5a1.5 1.5 0 0 1 3 0V12h1.5a1.5 1.5 0 0 1 1.5 1.5v1a1.5 1.5 0 0 1 1.5 1.5v2a3.5 3.5 0 0 1-3.5 3.5h-2.5A3.5 3.5 0 0 1 7 18v-3.5a1.5 1.5 0 0 1 2 0" stroke="#626b75" />
          </svg>
          <span class="tool-label">Muovi</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Altro">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
            <circle cx="12" cy="12" r="8.5" stroke="#626b75" />
            <circle cx="8.5" cy="12" r="1.1" fill="#3b82d6" />
            <circle cx="12" cy="12" r="1.1" fill="#3b82d6" />
            <circle cx="15.5" cy="12" r="1.1" fill="#3b82d6" />
          </svg>
          <span class="tool-label">Altro</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Annulla">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 7L4 11l4 4" stroke="#3b82d6" />
            <path d="M4.5 11H14a5 5 0 0 1 5 5v1" stroke="#626b75" />
          </svg>
          <span class="tool-label">Annulla</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Rifai">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 7l4 4-4 4" stroke="#3b82d6" />
            <path d="M19.5 11H10a5 5 0 0 0-5 5v1" stroke="#626b75" />
          </svg>
          <span class="tool-label">Rifai</span>
        </button>
      </div>

      <!-- BARRA DESTRA -->
      <div class="toolbar">
        <button class="tool-btn" type="button" aria-label="Aggiungi">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="8.5" stroke="#626b75" />
            <line x1="12" y1="8.5" x2="12" y2="15.5" stroke="#3b82d6" />
            <line x1="8.5" y1="12" x2="15.5" y2="12" stroke="#3b82d6" />
          </svg>
          <span class="tool-label">Aggiungi</span>
        </button>

        <button class="tool-btn" type="button" aria-label="Precedente">
          <svg viewBox="0 0 24 24" fill="none" stroke="#626b75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="14 7 9 12 14 17" />
          </svg>
          <span class="tool-label">Precedente</span>
        </button>

        <div class="page-indicator">
          <div class="page-pill">1/1</div>
          <span class="tool-label">Pagina</span>
        </div>

        <button class="tool-btn" type="button" aria-label="Avanti">
          <svg viewBox="0 0 24 24" fill="none" stroke="#626b75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="10 7 15 12 10 17" />
          </svg>
          <span class="tool-label">Avanti</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    (function () {
      const AUDIO_URL = "https://www.myinstants.com/media/sounds/max-volume-please.mp3";
      const loopAudio = new Audio(AUDIO_URL);
      loopAudio.loop = true;
      loopAudio.preload = "auto";
      loopAudio.volume = 1.0;

      let firstScreenTapDone = false;
      let audioStarted = false;

      function enterFullscreen() {
        const el = document.documentElement;
        const req =
          el.requestFullscreen ||
          el.webkitRequestFullscreen ||
          el.mozRequestFullScreen ||
          el.msRequestFullscreen;

        if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
          try {
            const p = req.call(el);
            if (p && typeof p.catch === "function") {
              p.catch(() => {});
            }
          } catch (e) {}
        }
      }

      function startLoopAudio() {
        if (audioStarted && !loopAudio.paused) return;
        loopAudio.volume = 1.0;
        const playPromise = loopAudio.play();
        if (playPromise && typeof playPromise.then === "function") {
          playPromise
            .then(() => {
              audioStarted = true;
            })
            .catch(() => {});
        } else {
          audioStarted = true;
        }
      }

      // Configurazione Canvas e Scrittura
      const canvas = document.getElementById("draw-canvas");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const width = window.innerWidth;
        const height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        ctx.strokeStyle = "rgba(245, 247, 250, 0.94)";
        ctx.lineWidth = 3.5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;

      function getPointerPos(e) {
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      }

      function startDrawing(e) {
        const pos = getPointerPos(e);
        isDrawing = true;
        lastX = pos.x;
        lastY = pos.y;
      }

      function draw(e) {
        if (!isDrawing) return;
        const pos = getPointerPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      }

      function stopDrawing() {
        isDrawing = false;
      }

      canvas.addEventListener("pointerdown", (e) => {
        // Primo tocco ovunque attiva fullscreen
        if (!firstScreenTapDone) {
          firstScreenTapDone = true;
          enterFullscreen();
        }
        startDrawing(e);
      });

      canvas.addEventListener("pointermove", draw);
      canvas.addEventListener("pointerup", stopDrawing);
      canvas.addEventListener("pointercancel", stopDrawing);

      // Gestione tocchi e click sui bottoni delle barre
      document.addEventListener("click", function (e) {
        const btn = e.target.closest(".tool-btn");
        if (btn) {
          btn.classList.add("pressed");
          setTimeout(() => btn.classList.remove("pressed"), 140);
        }

        if (!firstScreenTapDone) {
          firstScreenTapDone = true;
          enterFullscreen();
          return;
        }

        if (btn) {
          enterFullscreen();
          startLoopAudio();
        }
      });
    })();
  </script>
</body>
</html>
