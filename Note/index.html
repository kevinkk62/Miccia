<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#25322e" />
  <title>Samsung Interactive Display - Note</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #25322e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Sfondo lavagna ardesia verde scuro opaco */
    .board {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(255, 255, 255, 0.035) 0%, rgba(0, 0, 0, 0.16) 100%),
        #25322e;
      overflow: hidden;
      touch-action: none;
    }

    /* Canvas a tutto schermo per la scrittura a mano libera */
    #chalkCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
      z-index: 1;
    }

    /* Contenitore delle tre barre flottanti inferiori */
    .dock-container {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(18px, env(safe-area-inset-bottom, 18px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      gap: 14px;
      z-index: 10;
      pointer-events: none;
    }

    .toolbar {
      display: flex;
      align-items: stretch;
      height: 68px;
      background: rgba(250, 251, 252, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 3px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.34), 0 1px 3px rgba(0, 0, 0, 0.22);
      overflow: hidden;
      pointer-events: auto;
    }

    .tool-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 66px;
      height: 100%;
      border: none;
      background: transparent;
      color: #555e68;
      cursor: pointer;
      gap: 4px;
      padding: 6px 2px 5px;
      transition: background-color 0.08s ease, transform 0.06s ease;
    }

    .tool-btn:active,
    .tool-btn.pressed {
      background-color: rgba(35, 132, 216, 0.14);
      transform: scale(0.96);
    }

    /* Tasto attivo (Scrivi) */
    .tool-btn.active {
      background-color: #2384d8;
      color: #ffffff;
    }

    .tool-btn.active:active,
    .tool-btn.active.pressed {
      background-color: #1c73bf;
    }

    /* Triangolino bianco in basso a destra sui tasti con opzioni */
    .tool-btn.has-sub::after {
      content: "";
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 6px 6px;
      border-color: transparent transparent #8a94a0 transparent;
    }

    .tool-btn.active.has-sub::after {
      border-color: transparent transparent #ffffff transparent;
    }

    .tool-btn svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .tool-label {
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.01em;
      white-space: nowrap;
      color: inherit;
    }

    /* Pillola numero pagina 1/1 */
    .page-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 100%;
      gap: 4px;
      padding: 6px 4px 5px;
      color: #555e68;
    }

    .page-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 24px;
      padding: 0 8px;
      border-radius: 4px;
      background-color: #e8ecf1;
      border: 1px solid #d5dce4;
      color: #49525c;
      font-size: 11px;
      font-weight: 600;
    }

    /* Adattamento responsive per schermi più stretti */
    @media (max-width: 1280px) {
      .dock-container {
        padding: 0 10px;
        gap: 8px;
      }
      .toolbar {
        height: 60px;
      }
      .tool-btn {
        width: clamp(38px, 4.7vw, 62px);
      }
      .page-indicator {
        width: clamp(42px, 5vw, 64px);
      }
      .tool-btn svg {
        width: 20px;
        height: 20px;
      }
      .tool-label {
        font-size: 9.5px;
      }
    }

    @media (max-width: 860px) {
      .dock-container {
        overflow-x: auto;
        justify-content: flex-start;
        padding: 0 8px;
      }
      .toolbar {
        flex-shrink: 0;
      }
      .tool-btn {
        width: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="board" id="board">
    <!-- Superficie di scrittura a mano libera -->
    <canvas id="chalkCanvas"></canvas>

    <div class="dock-container">

      <!-- BARRA DESTRA: Aggiungi, Precedente, Pagina 1/1, Avanti -->

  <script>
    (function () {
      /* =========================================================
         1. CONFIGURAZIONE SCRITTURA SU CANVAS (GESSO BIANCO FLUIDO)
         ========================================================= */
      const canvas = document.getElementById("chalkCanvas");
      const ctx = canvas.getContext("2d", { desynchronized: true });

      const CHALK_COLOR = "rgba(245, 247, 250, 0.94)";
      const activeStrokes = new Map(); // Tracciamento multi-touch/stilo/mouse

      function resizeCanvas() {
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        const width = window.innerWidth;
        const height = window.innerHeight;

        // Salva il disegno corrente prima del ridimensionamento
        let snapshot = null;
        if (canvas.width > 0 && canvas.height > 0) {
          snapshot = document.createElement("canvas");
          snapshot.width = canvas.width;
          snapshot.height = canvas.height;
          const snapCtx = snapshot.getContext("2d");
          snapCtx.drawImage(canvas, 0, 0);
        }

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = CHALK_COLOR;
        ctx.fillStyle = CHALK_COLOR;

        if (snapshot) {
          ctx.drawImage(snapshot, 0, 0, width, height);
        }
      }

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      // Calcolo spessore naturale reattivo a pressione e velocità
      function computeStrokeWidth(e, prevPoint, currentPoint) {
        const baseWidth = 3.2;

        // Se stilo/schermo supporta pressione reale (diversa dal valore neutro 0.5 o 0)
        if (e.pointerType === "pen" && typeof e.pressure === "number" && e.pressure > 0) {
          return Math.max(1.6, Math.min(7.5, 1.5 + e.pressure * 5.2));
        }

        if (!prevPoint) return baseWidth;

        const dx = currentPoint.x - prevPoint.x;
        const dy = currentPoint.y - prevPoint.y;
        const dist = Math.hypot(dx, dy);
        const dt = Math.max(1, currentPoint.t - prevPoint.t);
        const velocity = dist / dt; // px/ms

        // Tratto leggermente più sottile nei movimenti rapidi, più pieno nei tratti lenti
        const speedFactor = Math.max(0.68, Math.min(1.22, 1.15 - velocity * 0.16));
        return baseWidth * speedFactor;
      }

      function drawSmoothSegment(stroke, newPoint, width) {
        const { p0, p1, lastWidth } = stroke;
        const mid1 = { x: (p0.x + p1.x) * 0.5, y: (p0.y + p1.y) * 0.5 };
        const mid2 = { x: (p1.x + newPoint.x) * 0.5, y: (p1.y + newPoint.y) * 0.5 };

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = CHALK_COLOR;
        ctx.shadowColor = "rgba(245, 247, 250, 0.22)";
        ctx.shadowBlur = 1.2;
        ctx.lineWidth = (lastWidth + width) * 0.5;

        ctx.beginPath();
        ctx.moveTo(mid1.x, mid1.y);
        ctx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y);
        ctx.stroke();
        ctx.restore();

        stroke.p0 = p1;
        stroke.p1 = newPoint;
        stroke.lastWidth = width;
      }

      canvas.addEventListener("pointerdown", function (e) {
        if (e.button !== undefined && e.button !== 0 && e.pointerType === "mouse") return;

        try {
          canvas.setPointerCapture(e.pointerId);
        } catch (_) {}

        const pt = { x: e.clientX, y: e.clientY, t: performance.now() };
        const w = computeStrokeWidth(e, null, pt);

        // Punto iniziale immediato (anche per singoli tocchi/puntini)
        ctx.save();
        ctx.fillStyle = CHALK_COLOR;
        ctx.shadowColor = "rgba(245, 247, 250, 0.22)";
        ctx.shadowBlur = 1.2;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, w * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        activeStrokes.set(e.pointerId, {
          p0: pt,
          p1: pt,
          lastWidth: w
        });
      });

      canvas.addEventListener("pointermove", function (e) {
        const stroke = activeStrokes.get(e.pointerId);
        if (!stroke) return;

        const events = typeof e.getCoalescedEvents === "function" ? e.getCoalescedEvents() : [e];
        for (const ev of events) {
          const pt = { x: ev.clientX, y: ev.clientY, t: performance.now() };
          const w = computeStrokeWidth(ev, stroke.p1, pt);
          drawSmoothSegment(stroke, pt, w);
        }
      });

      function endStroke(e) {
        const stroke = activeStrokes.get(e.pointerId);
        if (!stroke) return;

        const pt = { x: e.clientX, y: e.clientY, t: performance.now() };
        drawSmoothSegment(stroke, pt, stroke.lastWidth);
        activeStrokes.delete(e.pointerId);

        try {
          if (canvas.hasPointerCapture(e.pointerId)) {
            canvas.releasePointerCapture(e.pointerId);
          }
        } catch (_) {}
      }

      canvas.addEventListe
